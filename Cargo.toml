[package]
name = "skp-reader"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
license = "LGPL-3.0-or-later"
description = "Pure-Rust reader for SketchUp SKP files, classic and ZIP/VFF containers"
repository = "https://github.com/OpenAEC-Foundation/skp-reader"

[workspace]

[dependencies]
openaec-model = { version = "0.1.0", git = "https://github.com/OpenAEC-Foundation/openaec-model", rev = "392747b39bb56721aeac0f007002e6ea6b332eb6" }
glam = "0.30"
serde_json = "1"
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
earcutr = "0.5"

[features]
corpus-tests = []
