[package]
name = "skp-reader"
version = "0.2.0"
edition = "2021"
rust-version = "1.88"
license = "LGPL-3.0-or-later"
description = "Pure-Rust reader for SketchUp SKP files, classic and ZIP/VFF containers"
repository = "https://github.com/OpenAEC-Foundation/sketchup-dll"

[workspace]

[dependencies]
glam = "0.30"
serde_json = "1"
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
earcutr = "0.5"

[features]
corpus-tests = []
